name: Visibility Probe
on:
  push:
    branches: [fix/portfolio-hide-selected-20261016]
    paths: [.github/workflows/visibility-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QA_PACKAGE: /tmp/portfolio-qa/package.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run check && npm run build
      - run: |
          npm install --prefix /tmp/portfolio-qa --package-lock=false --no-save playwright@1.64.0
          /tmp/portfolio-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Record failing visibility contract before changes
        run: |
          set +e
          node tests/browser-section-visibility.mjs
          code=$?
          set -e
          test "$code" -ne 0
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('qa/section-visibility/results.json'));if(!r.filter(x=>x.width).every(x=>x.failure?.includes('Requested editorial explanation is hidden')))process.exit(1);"
      - name: Package exact source for isolated review
        if: always()
        run: |
          mkdir -p qa/source
          tar --exclude=./.git --exclude=./node_modules --exclude=./qa -czf qa/source/portfolio-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visibility-probe-evidence
          path: qa/
          retention-days: 2
