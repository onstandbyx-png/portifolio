name: Prepare Narrative Review
on:
  push:
    branches: [fix/portfolio-narrative-20261016]
    paths: [.github/workflows/prepare-narrative-review.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'onstandbyx-png/portifolio' && github.ref == 'refs/heads/fix/portfolio-narrative-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce current source build
        run: |
          npm ci
          npm run check
          npm run build
          node --test tests/*.test.mjs
          tar --exclude=./.git --exclude=./qa -czf /tmp/portfolio-review-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-source
          path: /tmp/portfolio-review-source.tar.gz
          retention-days: 1
