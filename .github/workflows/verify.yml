name: Verify Portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: portfolio-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [narrative, motion-rhythm, static-presentations, badge-loading, gestures, readable-hero]
    env:
      QA_PACKAGE: /tmp/portfolio-qa/package.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify source, build and unit contracts
        run: npm run check && npm run build && node --test tests/*.test.mjs
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/portfolio-qa --package-lock=false --no-save playwright@1.64.0
          /tmp/portfolio-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate ${{ matrix.suite }}
        run: node tests/browser-${{ matrix.suite }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-${{ matrix.suite }}-evidence
          path: qa/
          retention-days: 7
