name: Verify Portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_PACKAGE: /tmp/portfolio-qa/package.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check && npm run build
      - name: Install browser validation
        run: |
          npm install --prefix /tmp/portfolio-qa --package-lock=false --no-save playwright@1.64.0
          /tmp/portfolio-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate real page interactions
        run: node tests/browser-sections.mjs
      - name: Validate project and contact journeys
        run: node tests/browser-conversion.mjs
      - name: Validate reconstructed video pass
        run: node tests/browser-kinetic-pass.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section-interactions-evidence
          path: qa/
          retention-days: 7
