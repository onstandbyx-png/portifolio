name: Verify Portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_PACKAGE: /tmp/portfolio-qa/package.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check && npm run build
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/portfolio-qa --package-lock=false --no-save playwright@1.64.0
          /tmp/portfolio-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate badge loading and consistent fallback artwork
        run: node tests/browser-badge-loading.mjs
      - name: Validate static artwork, accessible navigation and local contact
        run: node tests/browser-static-presentations.mjs
      - name: Validate touch gestures and badge stability
        run: node tests/browser-gestures.mjs
      - name: Validate readable hero layouts and independent interaction
        run: node tests/browser-readable-hero.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-evidence-review
          path: qa/
          retention-days: 7
