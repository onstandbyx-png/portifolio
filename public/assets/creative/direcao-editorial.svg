<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Dar forma ao que importa — estudo autoral de direção editorial</title>
  <desc id="desc">Prancha editorial em papel, verde e cobre. A tipografia dialoga com uma esfera construída por curvas e com um grid de composição.</desc>
