    <clipPath id="sphere"><circle cx="840" cy="1000" r="415"/></clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f6f2"/><stop offset="1" stop-color="#e9e8dc"/></linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#paper)"/>
