<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Atenção pede direção — estudo autoral de narrativa</title>
  <desc id="desc">Prancha verde escura com título editorial e uma linha de cobre conectando os capítulos pergunta, tensão e descoberta.</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#f6f6f2" stroke-opacity=".055"/></pattern>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#274b38"/><stop offset="1" stop-color="#16221c"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M1 1L5 4L1 7" fill="none" stroke="#bc6748" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/><rect width="1200" height="1500" fill="url(#grid)"/>
  <path d="M72 78H1128M72 1422H1128" stroke="#f6f6f2" stroke-opacity=".32"/>
  <g fill="#f6f6f2" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2.8">
    <text x="72" y="57">IDEIA</text><path d="M148 56L159 45M148 45H159V56" fill="none" stroke="currentColor" stroke-width="1.7" color="#f6f6f2"/><text x="174" y="57">EXECUÇÃO.</text><text x="1128" y="57" text-anchor="end">ESTUDO AUTORAL / 02</text>
  </g>
  <circle cx="88" cy="148" r="8" fill="#bc6748"/><text x="112" y="154" fill="#f6f6f2" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="3">ARQUITETURA DA NARRATIVA</text>
  <g fill="#f6f6f2" font-family="Georgia, 'Times New Roman', serif" font-size="172" letter-spacing="-8">
    <text x="65" y="365">Atenção</text><text x="65" y="530">pede <tspan font-style="italic">direção.</tspan></text>
  </g>
  <path d="M274 807C274 1081 916 592 916 915S280 1056 280 1234" fill="none" stroke="#bc6748" stroke-width="5"/>
  <g fill="#f6f6f2" stroke="#f6f6f2" stroke-opacity=".2">
    <rect x="72" y="672" width="404" height="234" rx="3" fill="#f6f6f2"/>
    <rect x="718" y="829" width="410" height="234" rx="3" fill="#224331"/>
    <rect x="72" y="1140" width="510" height="234" rx="3" fill="#224331"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="103" y="717" fill="#bc6748" font-size="18" letter-spacing="2">01 / ABERTURA</text>
    <text x="103" y="787" fill="#16221c" font-size="43" letter-spacing="-1">Uma pergunta.</text>
    <text x="103" y="848" fill="#274b38" font-size="22">O que faz alguém parar?</text>
    <text x="749" y="874" fill="#cda088" font-size="18" letter-spacing="2">02 / DESENVOLVIMENTO</text>
    <text x="749" y="944" fill="#f6f6f2" font-size="43" letter-spacing="-1">Uma tensão.</text>
    <text x="749" y="1005" fill="#cbd1c7" font-size="22">O que ainda falta descobrir?</text>
    <text x="103" y="1185" fill="#cda088" font-size="18" letter-spacing="2">03 / ENTREGA</text>
    <text x="103" y="1255" fill="#f6f6f2" font-size="43" letter-spacing="-1">Uma descoberta.</text>
    <text x="103" y="1316" fill="#cbd1c7" font-size="22">A promessa ganha sentido.</text>
  </g>
  <g fill="#bc6748"><circle cx="500" cy="823" r="9"/><circle cx="692" cy="944" r="9"/><circle cx="610" cy="1228" r="9"/></g>
  <g fill="#f6f6f2" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.5">
    <text x="72" y="1462">ROTEIRO · RITMO · DESCOBERTA</text><text x="1128" y="1462" text-anchor="end">ESTRUTURA ILUSTRATIVA</text>
  </g>
</svg>
