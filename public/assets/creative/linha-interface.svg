  <title id="title">LINHA — interface de revisão criativa, produto conceito</title>
  <desc id="desc">Projeto Lançamento / coleção 01, versão v03 em revisão. O fluxo conecta briefing, revisão e aprovado. Um comentário pede: Trazer o benefício para a primeira linha. Interface ilustrativa de um produto fictício.</desc>
