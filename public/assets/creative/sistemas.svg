  <rect x="72" y="696" width="454" height="300" rx="12" fill="#fff" stroke="#16221c" stroke-opacity=".15"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="104" y="745" font-size="17" fill="#bc6748" letter-spacing="2">01 / ENTRADA</text><text x="104" y="797" font-size="36" fill="#16221c" letter-spacing="-1">Qual é o objetivo?</text></g>
  <rect x="104" y="831" width="390" height="59" rx="7" fill="#f6f6f2" stroke="#274b38" stroke-opacity=".14"/><text x="123" y="868" fill="#274b38" font-family="Arial, Helvetica, sans-serif" font-size="21">Dar forma a uma nova ideia</text>
  <rect x="104" y="917" width="191" height="46" rx="23" fill="#274b38"/><text x="127" y="947" fill="#f6f6f2" font-family="Arial, Helvetica, sans-serif" font-size="19">Explorar caminhos</text>
  <rect x="598" y="883" width="480" height="301" rx="12" fill="#16221c" opacity=".07"/>
  <rect x="588" y="869" width="480" height="301" rx="12" fill="url(#panel)"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="620" y="918" font-size="17" fill="#cda088" letter-spacing="2">02 / LÓGICA</text><text x="620" y="970" font-size="36" fill="#f6f6f2" letter-spacing="-1">Conectar as partes.</text></g>
  <g fill="#f6f6f2" fill-opacity=".1" stroke="#f6f6f2" stroke-opacity=".2"><rect x="620" y="1005" width="182" height="53" rx="6"/><rect x="820" y="1005" width="216" height="53" rx="6"/><rect x="620" y="1074" width="416" height="53" rx="6"/></g>
  <g fill="#f6f6f2" font-family="Arial, Helvetica, sans-serif" font-size="21"><text x="642" y="1039">Contexto</text><text x="842" y="1039">Possibilidades</text><text x="642" y="1108">Decisão + direção + execução</text></g>
  <rect x="82" y="1129" width="590" height="242" rx="12" fill="#16221c" opacity=".07"/><rect x="72" y="1115" width="590" height="242" rx="12" fill="#fff" stroke="#16221c" stroke-opacity=".15"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="104" y="1164" font-size="17" fill="#bc6748" letter-spacing="2">03 / RESPOSTA</text><text x="104" y="1216" font-size="36" fill="#16221c" letter-spacing="-1">O próximo passo, claro.</text><text x="104" y="1273" font-size="22" fill="#274b38">Uma interface com intenção.</text></g>
