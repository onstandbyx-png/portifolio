<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Uma ideia que funciona — estudo autoral de experiência digital</title>
  <desc id="desc">Diagrama editorial em papel com três módulos conectados: entrada, lógica e resposta. Os controles são ilustrações de interface.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.2" fill="#274b38" opacity=".16"/></pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#274b38"/><stop offset="1" stop-color="#16221c"/></linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="#f6f6f2"/><rect width="1200" height="1500" fill="url(#grid)"/>
  <path d="M72 78H1128M72 1422H1128" stroke="#16221c" stroke-opacity=".32"/>
  <g fill="#16221c" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2.8"><text x="72" y="57">IDEIA</text><path d="M148 56L159 45M148 45H159V56" fill="none" stroke="currentColor" stroke-width="1.7" color="#16221c"/><text x="174" y="57">EXECUÇÃO.</text><text x="1128" y="57" text-anchor="end">ESTUDO AUTORAL / 03</text></g>
  <circle cx="88" cy="148" r="8" fill="#bc6748"/><text x="112" y="154" fill="#274b38" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="3">EXPERIÊNCIA DIGITAL</text>
  <g fill="#16221c" font-family="Georgia, 'Times New Roman', serif" font-size="154" letter-spacing="-7"><text x="65" y="354">Uma ideia</text><text x="65" y="503">que <tspan font-style="italic">funciona.</tspan></text></g>
  <text x="72" y="572" fill="#274b38" font-family="Arial, Helvetica, sans-serif" font-size="25">Menos atrito entre a intenção e a ação.</text>
  <g fill="none" stroke="#bc6748" stroke-width="4"><path d="M365 857H541Q588 857 588 904V946"/><path d="M864 1058H1049Q1098 1058 1098 1107V1244Q1098 1282 1060 1282H670"/></g>
