<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Histórias que ficam.</title>
  <desc id="desc">Estudo autoral de composição editorial. Uma linha conecta três momentos da construção narrativa: pergunta, contexto e narrativa.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#f6f6f2" stroke-opacity=".045"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#274b38"/><stop offset="1" stop-color="#16221c"/></linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#bg)"/><rect width="1000" height="600" fill="url(#grid)"/>
  <g fill="none" stroke="#f6f6f2" stroke-opacity=".11" stroke-width="1.2">
    <ellipse cx="936" cy="257" rx="192" ry="228"/><ellipse cx="936" cy="257" rx="150" ry="228"/><ellipse cx="936" cy="257" rx="100" ry="228"/><ellipse cx="936" cy="257" rx="44" ry="228"/>
  </g>
  <circle cx="98" cy="78" r="6" fill="#bc6748"/>
  <text x="118" y="85" fill="#dce2d8" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2.2">EXPLORAÇÃO NARRATIVA</text>
  <g fill="#f6f6f2" font-family="Georgia, 'Times New Roman', serif" font-size="112" letter-spacing="-5">
    <text x="88" y="230">Histórias</text><text x="88" y="345">que <tspan font-style="italic">ficam.</tspan></text>
  </g>
