  <g fill="#bc6748"><circle cx="101" cy="466" r="7"/><circle cx="427" cy="466" r="7"/><circle cx="752" cy="466" r="7"/></g>
  <g fill="#c9d2c5" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.2"><text x="101" y="440">01</text><text x="427" y="440">02</text><text x="752" y="440">03</text></g>
  <g fill="#f6f6f2" font-family="Arial, Helvetica, sans-serif" font-size="25"><text x="101" y="514">Pergunta</text><text x="427" y="514">Contexto</text><text x="752" y="514">Narrativa</text></g>
